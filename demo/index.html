<style>

:root{--bg:#05060B;--card:#0D1019;--fg:#E9EDFB;--muted:#8A93B2;--line:#1A2036;--pri:#2F5CFF;--sec:#7C9CFF;--acc:#3FB4FF;--ok:#2FD08A;--warn:#F2B04A;--bad:#FF5C6C;--grey:#394261;--blue:#4C86FF;--soft:#0F1A40;--ink-on:#fff;color-scheme:dark;

*{box-sizing:border-box}

.stat span{color:var(--muted);font-size:12px}

.node{cursor:pointer}.node rect{stroke-width:2}

<script>
"use strict";
/* ============ Engine (port of backend/app/core/*.py) ============ */
const P_INIT=.30,P_LEARN=.15,P_GUESS=.20,P_SLIP=.10;
const bandOf=(p,att)=>!att?'not_assessed':p>=.8?'mastered':p>=.5?'developing':'weak';
function bktUpdate(st,ok,d,rq,nov=1){
  const g=P_GUESS*(1.25-.125*(d-1)),s=P_SLIP*(1.4-.2*(d-1));
  const p=Math.min(Math.max(st.p,.001),.999);
  const num=ok?p*(1-s):p*s, den=ok?num+(1-p)*g:num+(1-p)*(1-g);
  let w=Math.max(0,Math.min(1,rq))*Math.max(0,Math.min(1,nov)); if(!ok) w=Math.max(w,.35);
  const wt=p+w*(num/den-p), np=wt+(1-wt)*(ok?P_LEARN*nov:0), att=st.att+1;
  return {p:Math.min(.98,Math.max(0,np)),att,cor:st.cor+(ok?1:0),conf:1-Math.exp(-att/3)};
}
const decayed=(p,last,now,hl=30)=>last?P_INIT+(p-P_INIT)*Math.pow(.5,Math.max(0,(now-last)/864e5)/hl):p;
const BASE=[1,3,7,14,30];
function srsSchedule(r,q,now,diff,misOpen){
  q=Math.max(0,Math.min(1,q));
  const ease=Math.max(1.3,r.ease+(.1-(1-q)*(.8+(1-q)*.4)));
  if(q<.6) return {rev:{reps:0,ease,interval:1},due:now+864e5};
  const reps=r.reps+1; let iv=BASE[Math.min(reps-1,4)]*(ease/2.3);
  if(reps>5) iv=r.interval*ease;

let ses=null; // {mode, q, cid, queue, t0, chosen, fb}
function pickQuestion(cid){
  const p=curP(cid),rec=cs(cid).recent,d=targetDifficulty(p,rec);
  const tags=openMis(cid).map(m=>m.tag);
  const askedRecent=S.log.slice(-8).map(l=>l.qid);
  let pool=QS.filter(q=>q.c===cid&&!askedRecent.includes(q.id)); if(!pool.length) pool=QS.filter(q=>q.c===cid);
  const targeted=pool.filter(q=>tags.some(t=>Object.values(q.m||{}).includes(t)||Object.values(q.mw||{}).includes(t)));
  if(targeted.length) pool=targeted;
  pool.sort((a,b)=>Math.abs(a.d-d)-Math.abs(b.d-d)); return {q:pool[0],d,targeted:!!targeted.length};
}
function nextConceptId(){
  const m=id=>cs(id).att?curP(id):P_INIT;
  let cand=CONCEPTS.filter(c=>c.pre.every(p=>m(p)>=.5));
  if(!cand.length) cand=CONCEPTS.filter(c=>!c.pre.length);
  const pend=cand.filter(c=>m(c.id)<.8); if(pend.length) cand=pend;
  return cand.sort((a,b)=>m(a.id)-m(b.id)||a.id.localeCompare(b.id))[0].id;
}
function evaluate(q,val,reasoning){
  let ok=false,tag=null;
  if(q.t==='mcq'){ok=Number(val)===q.a;tag=(q.m||{})[val]||null;}
  else if(q.t==='num'){const x=parseFloat(val);ok=isFinite(x)&&Math.abs(x-q.a)<=q.tol*Math.abs(q.a);if(!ok&&q.mw)for(const k in q.mw)if(Math.abs(x-Number(k))<1e-9)tag=q.mw[k];}
  else{const v=String(val).toLowerCase();ok=q.a.some(k=>v.includes(k));}
  const an=analyse(q.c,ok,reasoning);
  let mtag=an.tag, conf=an.conf;
  if(!mtag&&tag&&!ok){mtag=tag;conf=.75;}
  return {ok,an,mtag,conf};
}
function applyResult(q,r,secs){
  const c=cs(q.c),before=curP(q.c);
  const seen=S.log.slice(-8).some(l=>l.qid===q.id);
  const nxt=bktUpdate({p:before,att:c.att,cor:c.cor,conf:c.conf},r.ok,q.d,r.an.rq,seen?.5:1);
  Object.assign(c,nxt,{last:now()}); c.hist.push([now(),c.p]); c.recent=[...c.recent,r.ok].slice(-6);
  let rec=null;
  if(r.mtag&&MIS[r.mtag]){
    const m=MIS[r.mtag]; rec=S.mis.find(x=>!x.resolved&&x.tag===r.mtag&&x.c===q.c);
    if(rec){rec.count++;rec.t=now();} else{rec={id:Date.now()+Math.random(),c:q.c,tag:r.mtag,label:m.label,fix:m.fix,reasoning:r.reasoning||'(no written reasoning)',sev:r.ok?'low':'medium',conf:r.conf,count:1,t:now(),resolved:false};S.mis.push(rec);}
  }else if(r.ok&&c.recent.slice(-2).length===2&&c.recent.slice(-2).every(Boolean)) openMis(q.c).forEach(m=>m.resolved=true);
  const quality=(r.ok?1:0)*.6+r.an.rq*.4;
  const s=srsSchedule(c.rev,quality,now(),CBY[q.c].d,openMis(q.c).length>0);
  c.rev=s.rev;c.due=s.due;
  S.secs+=secs; S.log.push({t:now(),c:q.c,qid:q.id,ok:r.ok,delta:(c.p-before)*100,mis:rec?rec.label:null});
  save(); return {delta:(c.p-before)*100,rec};
}

function vClass(){

  const colAvg=CONCEPTS.map((c,i)=>{const v=rows.map(r=>r.ps[i]).filter(x=>x!==null);return {avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,weak:v.filter(x=>x<.5).length,n:v.length};});
  const sAvg=r=>{const v=r.ps.filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const all=rows.flatMap(r=>r.ps).filter(x=>x!==null);

function bindQuestion(){}
const App=document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-node]'); if(!t) return;
  const D=t.dataset;
  if(D.role){role=D.role;tab=TABS[role][0][0];ses=null;render();return;}
  if(D.tab){tab=D.tab;if(tab!=='learn'&&tab!=='diag'&&ses&&ses.fb)ses=null;render();return;}
  if(D.go){tab=D.go;render();return;}
  if(D.node){selNode=D.node;render();return;}
  if(D.learn){tab='learn';startPractice(D.learn);render();return;}
  if(D.opt!==undefined){ses.chosen=D.opt;render();return;}
  if(D.demo!==undefined){loadDemo();ses=null;selNode=null;render();return;}
  if(D.rv){S.rv=S.rv||{};if(D.rv[0]==='m'){const m=S.mis.find(x=>'m'+x.id===D.rv);if(m){m.rev=D.d;if(D.d==='dismissed')m.resolved=true;}}else S.rv[D.rv]=D.d;save();render();return;}
  if(D.reset!==undefined){const rl=S.roll;S=fresh();S.roll=rl;save();ses=null;selNode=null;render();return;}
  if(D.rediag!==undefined){S.diagDone=false;ses=null;render();return;}
  if(D.skew){S.skew=D.skew==='-999'?0:S.skew+Number(D.skew);save();render();return;}
  if(D.submit!==undefined){
    const q=ses.q; let val=ses.chosen; const a=document.getElementById('ans'); if(a) val=a.value;
    if(val===null||String(val).trim()===''){ses.err=1;alert_(q);return;}
    const why=document.getElementById('why').value, r=evaluate(q,val,why); r.reasoning=why;
    const before=curP(q.c),res=applyResult(q,r,Math.round((Date.now()-ses.t0)/1000));
    ses.fb={r,res,before}; render();return;
  }
  if(D.next!==undefined){
    if(ses.mode==='diag'){ses.idx++; if(ses.idx>=ses.queue.length){S.diagDone=true;save();ses=null;render();return;}
      ses.q=ses.queue[ses.idx];ses.cid=ses.q.c;ses.chosen=null;ses.fb=null;ses.t0=Date.now();}
    else{ const wasMis=ses.fb.res.rec; startPractice(wasMis?ses.q.c:undefined);}
    render();return;
  }
  if(D.ask!==undefined){
    const v=(document.getElementById('ask').value||'').toLowerCase(),c=CBY[ses.q.c];
    if(aiGet().key){const box=document.getElementById('tutor');box.textContent='Thinking…';aiAsk(c.id,document.getElementById('ask').value||('Explain '+c.n)).then(t=>{S.ask.push(t);save();box.textContent=t;}).catch(e=>{box.textContent='OpenAI error: '+e.message+'. Check your key on the Dashboard.';});return;}
    let r=`${c.desc} `; const ms=openMis(c.id); if(ms.length) r+=`Because you have a possible mix-up here (${ms[0].label.toLowerCase()}), try this: ${ms[0].fix} `;
    else if(cs(c.id).att) r+=`You are at ${Math.round(curP(c.id)*100)}% on this concept. `;
    if(/why|how/.test(v)&&c.id==='ohms_law') r+='Think of resistance as narrowing a pipe: the same push (voltage) moves less flow (current) through it.';
    S.ask.push(r); save(); document.getElementById('tutor').textContent=r; return;
  }
  if(D.autoassign!==undefined){const rows=classRows();const w=CONCEPTS.map((c,i)=>({c,n:rows.filter(r=>r.ps[i]!==null&&r.ps[i]<.5).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,3);
    if(w.length){const d=new Date(Date.now()+7*864e5).toISOString().slice(0,10);S.assign.push({cs:w.map(x=>x.c.id),d:2,due:d});save();render();}return;}
  if(D.assign!==undefined){
    const cs_=[...document.querySelectorAll('input[name=ac]:checked')].map(x=>x.value); if(!cs_.length){return;}
    S.assign.push({cs:cs_,d:+document.getElementById('adif').value||2,due:document.getElementById('adue').value}); save(); render();return;
  }
});

    <article class="glass"><p class="l-k">Mastery model</p><div class="big">${Math.round(ex.pts[ex.pts.length-1]*100)}<small>%</small></div>${sparkSVG(ex.pts)}
     <p class="l-m">Five example answers: two misses, then three correct. Mastery climbs as evidence builds, and a single miss never zeroes it.</p></article>
    <article class="glass"><p class="l-k">Misconception detection</p><blockquote>“${esc(ex.text)}”</blockquote>
     <div class="chipl">${mis?`<b>${esc(mis.label)}</b><span>${Math.round(ex.an.conf*100)}% confidence · a prediction, reviewed by a teacher when unsure</span>`:'<b>No pattern matched</b>'}</div>
     <p class="l-m">${mis?esc(mis.fix):''}</p></article>
    <article class="glass"><p class="l-k">Spaced revision</p><div class="big">${ex.ladder[ex.ladder.length-1]}<small> days</small></div>
     <ol class="ladder">${ex.ladder.map((d,i)=>`<li><i style="height:${14+Math.min(80,d*2.4)}px"></i><b>${d}d</b><small>review ${i+1}</small></li>`).join('')}</ol>
     <p class="l-m">If every review goes well, gaps between reviews stretch. A miss or an open misconception pulls the next review closer.</p></article>
   </div>
   <div class="l-end"><button class="l-pill" data-l="student">Open the student view <span class="ar">${ARROW}</span></button><button class="l-ghost" data-l="teacher">Open the teacher view</button></div>
   <p class="l-foot">Demo data stays in your browser. The class heatmap is sample data; only your own roll number is live.</p>
  </section>`;
}

/* ---------- electric-field background ---------- */
function landField(cv,still){
  const ctx=cv.getContext('2d'),dpr=Math.min(1.5,window.devicePixelRatio||1);let W=0,H=0,ps=[];const L=16;
  const fit=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);};
  fit();const N=W<700?320:820;
  const src=t=>{const m=W<700;return [
    {x:W*(m?.5:.68)+Math.sin(t*.22)*W*.05,y:H*(m?.3:.40)+Math.cos(t*.3)*H*.06,q:1},
    {x:W*(m?.8:.88)+Math.cos(t*.19)*W*.03,y:H*(m?.55:.62)+Math.sin(t*.26)*H*.07,q:-1},
    {x:W*(m?.25:.5)+Math.cos(t*.17)*W*.04,y:H*(m?.7:.74)+Math.sin(t*.21)*H*.05,q:-.8}]
    .concat(LAND.ptr?[{x:LAND.ptr.x,y:LAND.ptr.y,q:-1.5}]:[]);};
  const spawn=(q,c)=>{const pos=c.filter(s=>s.q>0)[0]||c[0],a=Math.random()*6.283,r=14+Math.random()*10;
    q.x=new Float32Array(L).fill(pos.x+Math.cos(a)*r);q.y=new Float32Array(L).fill(pos.y+Math.sin(a)*r);q.age=Math.random()*40|0;q.life=420+Math.random()*460|0;};
  const c0=src(0);for(let i=0;i<N;i++){const q={};spawn(q,c0);q.age=Math.random()*q.life|0;ps.push(q);}
  const step=(dt,c)=>{for(const q of ps){let ex=0,ey=0,dead=false;const px=q.x[L-1],py=q.y[L-1];
    for(const s of c){const dx=px-s.x,dy=py-s.y,r2=dx*dx+dy*dy+60,r=Math.sqrt(r2),k=s.q*1400/(r2*r);ex+=dx*k;ey+=dy*k;if(s.q<0&&r<14)dead=true;}
    const m=Math.hypot(ex,ey)||1,sp=105+Math.min(120,m*1200);q.x.copyWithin(0,1);q.y.copyWithin(0,1);q.x[L-1]=px+ex/m*sp*dt;q.y[L-1]=py+ey/m*sp*dt;q.age++;
    if(dead||q.age>q.life||q.x[L-1]<-30||q.x[L-1]>W+30||q.y[L-1]<-30||q.y[L-1]>H+30)spawn(q,c);}};
  const draw=c=>{ctx.clearRect(0,0,W,H);
    for(const pass of [[0,.16],[L-6,.5]]){ctx.beginPath();for(const q of ps){const f=Math.min(1,q.age/30,(q.life-q.age)/40);if(f<=0)continue;ctx.moveTo(q.x[pass[0]],q.y[pass[0]]);for(let i=pass[0]+1;i<L;i++)ctx.lineTo(q.x[i],q.y[i]);}
      ctx.strokeStyle=`rgba(150,185,255,${pass[1]})`;ctx.lineWidth=1;ctx.stroke();}
    for(const s of c.slice(0,3)){const neg=s.q<0,col=neg?'47,92,255':'200,220,255',g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,58);g.addColorStop(0,`rgba(${col},1)`);g.addColorStop(.3,`rgba(${col},.4)`);g.addColorStop(1,`rgba(${col},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,58,0,6.283);ctx.fill();ctx.fillStyle=neg?'#fff':'#05060B';ctx.font='700 14px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(neg?'−':'+',s.x,s.y+1);}};
  if(still){for(let i=0;i<150;i++)step(.016,src(0));draw(src(0));return ()=>{};}
  let last=0;const loop=ts=>{if(!LAND.on)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;LAND.t+=dt;
    if(!document.hidden){const c=src(LAND.t);step(dt,c);draw(c);}LAND.raf=requestAnimationFrame(loop);};
  const onR=()=>{fit();};addEventListener('resize',onR);LAND.raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(LAND.raf);removeEventListener('resize',onR);};
}

function showLanding(){
  const el=document.getElementById('land');LAND.on=true;LAND.ptr=null;if(LAND.cleanup)LAND.cleanup();
  el.innerHTML=landHTML();el.style.display='block';el.scrollTop=0;document.body.style.overflow='hidden';
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  LAND.cleanup=landField(document.getElementById('lcv'),still);
  const first=el.querySelector('.l-first');
  first.onpointermove=e=>{const r=document.getElementById('lcv').getBoundingClientRect();LAND.ptr={x:e.clientX-r.left,y:e.clientY-r.top};};
  first.onpointerleave=()=>{LAND.ptr=null;};
}
function hideLanding(){
  LAND.on=false;if(LAND.cleanup){LAND.cleanup();LAND.cleanup=null;}
  const el=document.getElementById('land');el.style.display='none';document.body.style.overflow='';
  try{sessionStorage.setItem('learnova-landing','1');}catch(e){}window.scrollTo(0,0);
}
function landGo(a,id){
  const el=document.getElementById('land');
  if(a==='top'){el.scrollTo({top:0,behavior:'smooth'});return;}
  if(a==='how'){document.getElementById('l-how').scrollIntoView({behavior:'smooth'});return;}
  hideLanding();ses=null;
  if(a==='student'){role='student';tab='dashboard';}
  else if(a==='teacher'){role='teacher';tab='class';}
  else if(a==='lessons'){role='student';tab='syllabus';syl.open=null;}
  else if(a==='start'){role='student';tab=S.diagDone?'dashboard':'diag';}
  else if(a==='watch'){role='student';tab='syllabus';syl.open='electric_charge';resetPlayer();}
  else if(a==='practise'){role='student';tab='learn';startPractice(id);}
  render();
}
(function(){
  const el=document.createElement('div');el.id='land';el.setAttribute('role','region');el.setAttribute('aria-label','Learnova introduction');el.style.display='none';document.body.appendChild(el);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b)landGo(b.dataset.l,b.dataset.id);});
  document.addEventListener('click',e=>{if(e.target.closest('[data-home]'))showLanding();});
  let seen=false;try{seen=sessionStorage.getItem('learnova-landing')==='1';}catch(e){}
  if(!seen)showLanding();
})();

render();
</script>
