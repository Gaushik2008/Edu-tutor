name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest
      - name: Python tests
        run: cd backend && python -m pytest -q
      - name: Demo is up to date with its sources
        run: python demo/build.py && git diff --exit-code -- index.html docs/index.html demo/index.html
      - name: JS/Python parity
        run: node demo/parity.test.js
      - name: Misconception evaluation (prints precision/recall)
        run: python backend/eval/evaluate_misconceptions.py
